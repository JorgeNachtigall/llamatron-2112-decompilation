<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Llamatron 2112</title>
<link rel="icon" type="image/png" href="favicon.png">
<!--
  Llamatron port web shell (Emscripten --shell-file). The canvas fills the page at 4:3 with
  black letterboxing. SDL sizes its backbuffer from the canvas CSS size times the device pixel
  ratio (high-DPI), and the engine scales the image into it (F10: nearest / integer / sharp).
  F11, Alt+Enter or a double click put the page in full screen (the canvas still at 4:3).
  The canvas id must be "canvas": SDL2's Emscripten backend addresses it by that selector.
  Program output goes to the hidden <pre id="output"> (read by src/platform/tools/web_smoke.py).
  favicon.png is the app icon, drawn at build time from the extracted title picture
  (tools/make_icon.py), next to the page.
-->
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #canvas { position: absolute; display: block; outline: none; background: #000;
            image-rendering: pixelated; image-rendering: crisp-edges; }
  #output { display: none; }
  #sound { position: absolute; right: 8px; bottom: 8px; padding: 4px 8px; display: none;
           color: #ccc; background: rgba(0, 0, 0, 0.6); font: 12px/1.4 monospace;
           border: 1px solid #555; border-radius: 3px; pointer-events: none; }
  #status { position: absolute; left: 0; right: 0; top: 45%; text-align: center;
            color: #888; font: 14px/1.4 monospace; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<div id="status">Loading…</div>
<div id="sound">click for sound</div>
<pre id="output"></pre>
<script>
  (function () {
    var ASPECT_W = 4, ASPECT_H = 3;
    var canvas = document.getElementById('canvas');
    function fit() {
      var w = window.innerWidth, h = window.innerHeight;
      var cw = Math.min(w, Math.floor(h * ASPECT_W / ASPECT_H));
      var ch = Math.floor(cw * ASPECT_H / ASPECT_W);
      canvas.style.width = cw + 'px';
      canvas.style.height = ch + 'px';
      canvas.style.left = Math.floor((w - cw) / 2) + 'px';
      canvas.style.top = Math.floor((h - ch) / 2) + 'px';
    }
    /* Registered before the Emscripten runtime, so SDL sees the new CSS size on resize. */
    window.addEventListener('resize', fit);
    fit();
    /* Keyboard goes to the canvas (SDL_HINT_EMSCRIPTEN_KEYBOARD_ELEMENT = "#canvas"): take
       focus at start and on any click, and never let game keys scroll or activate the page.
       preventDefault does not stop propagation, so SDL still receives the keys. */
    function focusGame() { canvas.focus({ preventScroll: true }); }
    canvas.addEventListener('mousedown', focusGame);
    document.addEventListener('click', focusGame);
    window.addEventListener('load', focusGame);
    var GAME_KEYS = { ArrowUp: 1, ArrowDown: 1, ArrowLeft: 1, ArrowRight: 1, ' ': 1,
                      PageUp: 1, PageDown: 1, Home: 1, End: 1, Tab: 1, Backspace: 1, F10: 1 };
    /* Full screen: browsers allow it only from inside a key or click handler, so the page does
       it here (SDL swallows the same keys, platform_sdl.c keymap_host_key). */
    function toggleFullscreen() {
      if (document.fullscreenElement) {
        document.exitFullscreen().catch(function () {});
      } else if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(function () {});
      }
    }
    window.llamatronToggleFullscreen = toggleFullscreen;
    window.addEventListener('keydown', function (e) {
      if (e.key === 'F11' || (e.key === 'Enter' && e.altKey)) {
        e.preventDefault();
        if (!e.repeat) toggleFullscreen();
      } else if (GAME_KEYS[e.key]) {
        e.preventDefault();
      }
      if (document.activeElement !== canvas) focusGame();
    }, true);
    canvas.addEventListener('dblclick', toggleFullscreen);

    var output = document.getElementById('output');
    var status = document.getElementById('status');
    /* Test hook for web_smoke.py --report: ?report also posts each output line to the loopback
       test server (/report), for runs that need real time (IndexedDB) instead of virtual time. */
    var reporting = /[?&]report(&|$)/.test(location.search);
    function report(text) {
      if (reporting) navigator.sendBeacon('/report', text);
    }
    function print(text) {
      output.textContent += text + '\n';
      console.log(text);
      report(text);
    }
    /* Test hook for web_smoke.py: ?tap=Space sends one key press and release back to back
       (inside one frame) right after start-up. Does nothing without the parameter. */
    var KEY_CODES = { Space: 32, ArrowLeft: 37, ArrowUp: 38, ArrowRight: 39, ArrowDown: 40 };
    var tapMatch = /[?&]tap=(\w+)/.exec(location.search);
    function sendKey(type, code) {
      var e = new KeyboardEvent(type, { code: code, key: code === 'Space' ? ' ' : code,
                                        bubbles: true, cancelable: true });
      Object.defineProperty(e, 'keyCode', { get: function () { return KEY_CODES[code] || 0; } });
      Object.defineProperty(e, 'which', { get: function () { return KEY_CODES[code] || 0; } });
      canvas.dispatchEvent(e);
    }
    function tap(code) {
      sendKey('keydown', code);
      sendKey('keyup', code);
    }
    /* Test hook for the game's ?taps=F:SC:N (llamatron_main.c): a real browser key event for a
       PC make code, dispatched from inside a frame, so SDL hands it over with the next batch. */
    var CODE_BY_SCAN = { 57: 'Space', 72: 'ArrowUp', 75: 'ArrowLeft', 77: 'ArrowRight', 80: 'ArrowDown' };
    window.llamatronKey = function (type, scan) {
      if (CODE_BY_SCAN[scan]) sendKey(type, CODE_BY_SCAN[scan]);
    };

    window.Module = {
      canvas: canvas,
      onRuntimeInitialized: function () {
        if (tapMatch) setTimeout(function () { tap(tapMatch[1]); }, 0);
      },
      print: print,
      printErr: function (text) { output.textContent += text + '\n'; console.error(text); report(text); },
      onPersistSaved: function () { report('persist: saved'); },
      setStatus: function (text) { status.textContent = text; status.style.display = text ? '' : 'none'; },
      monitorRunDependencies: function () {},
    };
    window.Module.setStatus('Loading…');

    /* Browsers start audio suspended until a user gesture; SDL resumes it on the first click
       (a key would also end the title screen). Show a hint while that is pending. */
    var soundHint = document.getElementById('sound');
    setInterval(function () {
      var ctx = window.Module.SDL2 ? window.Module.SDL2.audioContext : null;  /* SDL2's state */
      soundHint.style.display = (ctx && ctx.state === 'suspended') ? 'block' : 'none';
    }, 250);
    window.addEventListener('error', function () { window.Module.setStatus('Error - see the browser console'); });
  })();
</script>
{{{ SCRIPT }}}
</body>
</html>
